name: Browser checks
# The browser suite (e2e/ui) and the golden-thread smoke against a disposable stack: a new database and
# non-owner role on the service PostgreSQL, in-memory storage and auth stand-ins, and the model replay
# (no key, no paid calls). Runs on pull requests, nightly on main (the reference projects in
# fixtures/golden-thread-* catch any figure that moves), and by hand.
# Written 26 October 2026 and first run on GitHub after that: watch the first runs and adjust timings.
on:
  pull_request:
  schedule:
    - cron: '30 1 * * *' # 03:30 in Johannesburg
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_ADMIN_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      GOLDEN_SMOKE_TARGET_MANIFEST: e2e-results/target-manifest.json
      GOLDEN_SMOKE_ADAPTER: e2e/adapter/golden-thread-adapter.mjs
      LIBREOFFICE_PATH: /usr/bin/soffice
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      # LibreOffice renders exported Word and PowerPoint files for the export checks.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress
      - run: npx playwright install --with-deps chromium
      # A production build served by `next start`, as the checks were written against.
      - name: Build
        run: |
          node scripts/e2e/prepare-build-db.mjs "$E2E_ADMIN_DATABASE_URL" ie_test_build
          NEXT_FONT_GOOGLE_MOCKED_RESPONSES="$PWD/scripts/e2e/font-mock.cjs" \
          DATABASE_URL=postgres://postgres@localhost:5432/ie_test_build \
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:39123 NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=local-stand-in \
          SUPABASE_SECRET_KEY=local-stand-in ANTHROPIC_API_KEY=stand-in \
          npx next build --webpack
          node scripts/e2e/prepare-build-db.mjs "$E2E_ADMIN_DATABASE_URL" ie_test_build --drop
      - name: Start the disposable stack
        run: |
          E2E_NEXT_START=. E2E_STORAGE_PORT=39123 nohup node scripts/e2e/local-stack.mjs > stack.log 2>&1 &
          for i in $(seq 1 120); do [ -s e2e-results/target-manifest.json ] && break; sleep 5; done
          test -s e2e-results/target-manifest.json || { cat stack.log; exit 1; }
      - name: Browser suite
        run: npx playwright test -c e2e/ui/ui-check.config.mjs --workers=1
      - name: Smoke (golden thread)
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: |
            e2e-results
            stack.log
          retention-days: 14
