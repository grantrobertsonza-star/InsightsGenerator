name: Retained validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Disposable PostgreSQL for the *.db.test.ts suites: each suite builds its own ie_test_*
      # database from supabase/migrations and drops it afterwards. pgvector is required by the
      # migrations. Trust auth on a throwaway service container only.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      # Fail the run if any real-database or Python-engine suite only ran its "NOT RUN" placeholder.
      VALIDATE_REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # The statistics engine (api/parse-stats-file.py) and its tests need pandas, openpyxl and
      # pyreadstat; requirements.txt pins them, pandas included (a supported range).
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      # The change's tier (AGENTS.md, "Change tiers"): written to the job summary so the review step
      # it needs is visible on the pull request.
      - name: Change tier
        if: github.event_name == 'pull_request'
        run: node scripts/change-tier.cjs --base "origin/${{ github.base_ref }}"
      # The whole repository lints clean since batch 29 (0 errors), so the gate is the whole tree.
      - name: Lint
        run: npx eslint .
      # The statistics engine's own reference checks (design variance, t reference, NETs, don't know).
      - name: Engine self-test
        run: python scripts/crosstab_selftest.py
      - run: npm run validate
